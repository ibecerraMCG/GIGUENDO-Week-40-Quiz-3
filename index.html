<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 40 Practice Quiz 3</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }[data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }

        [data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }[data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }[data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }[data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }[data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none;
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 40 Practice Quiz 3</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button in Header -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>
                
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>

    </div>

    <script>
        // --- Data ---
        const quizData =[
            // --- Section 1: Renal Water & Renal Sodium ---
            {
                section: "Renal Water & Renal Sodium",
                fullLO: "LO1: Describe the range in renal functional capacity, renal concentrating ability, and obligatory volume loss.",
                question: "A 35-year-old man is stranded on a life raft in the ocean for four days. In desperation, he decides to drink 1 liter of seawater, which has an osmolarity of approximately 2400 mOsm/L. Given that the maximum concentrating ability of the human kidney is 1200 mOsm/L (and 600 mOsm/L for salt), what will be the net effect on his total body water volume after his kidneys excrete the ingested salt?",
                options: {
                    A: "Net gain of 1 L",
                    B: "Net gain of 500 mL",
                    C: "No net change in volume",
                    D: "Net loss of 1 L",
                    E: "Net loss of 3 L"
                },
                correctAnswer: "E",
                rationale: "The human kidney has a maximum concentration ability for salt of 600 mOsm. Drinking 1 L of seawater introduces 2400 mOsm of salt. To excrete 2400 mOsm, the kidney requires 4 L of water (2400 / 600 = 4 L). Since the patient only took in 1 L of water, he will suffer a net loss of approximately 3 L, severely dehydrating him.",
                source: "Renal Water & Renal Sodium PDF, slide 19: 'Maximum [ ] ability of the human kidney for salt 600mOsm... =2400/600=4L. Took in 1L = 4L of water required to excrete 1L of sea water... each Liter drunk dehydrates ~3L!'"
            },
            {
                section: "Renal Water & Renal Sodium",
                fullLO: "LO1: Describe the range in renal functional capacity, renal concentrating ability, and obligatory volume loss.",
                question: "A 50-year-old woman is admitted to the hospital and restricted to taking nothing by mouth (NPO). Her body continues to generate daily metabolic waste, producing 600 mOsm of solute that must be excreted each day to maintain electrolyte balance. Assuming her kidneys can achieve a maximum urine osmolarity of 1200 mOsm/L, what is the minimum urinary volume she will excrete per day (obligatory volume loss)?",
                options: {
                    A: "0.25 L/day",
                    B: "0.5 L/day",
                    C: "1.0 L/day",
                    D: "2.0 L/day",
                    E: "5.0 L/day"
                },
                correctAnswer: "B",
                rationale: "Obligatory urine volume is the minimum urine volume required to dissolve and excrete daily solute loads. If 600 mOsm of solute must be excreted, and the maximum urine osmolarity is 1200 mOsm/L, the obligatory urine volume is 600 mOsm/day / 1200 mOsm/L = 0.5 L/day.",
                source: "Renal Water & Renal Sodium PDF, slide 12: 'If the max. urine osmolarity is 1200 mOsm/L, and 600 mOsm of solute must be excreted each day... the obligatory urine volume is: 600 mOsm/day / 1200 mOsm/L = 0.5 L/day'"
            },
            {
                section: "Renal Water & Renal Sodium",
                fullLO: "LO2: Explain the contribution of ADH to the composition and concentration of urine.",
                question: "A 28-year-old man sustains severe head trauma resulting in central diabetes insipidus, a condition characterized by a severe lack of antidiuretic hormone (ADH) secretion. Which of the following best describes the expected physiological state of his distal and collecting tubules during this condition?",
                options: {
                    A: "Decreased permeability to sodium",
                    B: "Decreased permeability to water",
                    C: "Increased permeability to water",
                    D: "Reversal of the countercurrent multiplier",
                    E: "Upregulation of urea transporters"
                },
                correctAnswer: "B",
                rationale: "When ADH is low (such as in diabetes insipidus), water permeability in the distal and collecting tubules decreases. The collecting duct becomes virtually impermeable to water, leading to the formation of a large volume of dilute urine.",
                source: "Renal Water & Renal Sodium PDF, slide 22: 'Formation of a Dilute Urine... Mechanism: Decreased ADH release which decreases water permeability in distal and collecting tubules'"
            },
            {
                section: "Renal Water & Renal Sodium",
                fullLO: "LO2: Explain the contribution of ADH to the composition and concentration of urine.",
                question: "A 40-year-old woman is lost in the desert for 24 hours without water, leading to severe dehydration. Her posterior pituitary maximizes the release of antidiuretic hormone (ADH). In the presence of high ADH, water is rapidly reabsorbed out of the tubular lumen into the interstitium. This process directly results in which of the following?",
                options: {
                    A: "Dilution of the medullary interstitium",
                    B: "Formation of highly concentrated urine",
                    C: "Inhibition of the countercurrent multiplier",
                    D: "Obligatory excretion of 20 L of urine per day",
                    E: "Secretion of large amounts of sodium"
                },
                correctAnswer: "B",
                rationale: "Increased ADH release increases water permeability in the distal and collecting tubules. As water is reabsorbed into the hyperosmotic medullary interstitium, it allows the kidney to continue electrolyte reabsorption and increase water reabsorption, resulting in the formation of a concentrated urine.",
                source: "Renal Water & Renal Sodium PDF, slide 22: 'Formation of a Concentrated Urine... Mechanism: Increased ADH release which increases water permeability in distal and collecting tubules'"
            },
            {
                section: "Renal Water & Renal Sodium",
                fullLO: "LO3: Explain the operation and importance of the counter current multiplier in the formation of concentrated urine.",
                question: "A medical student is researching the buildup of solute in the renal medulla that establishes the hyperosmotic gradient necessary for concentrating urine. She notes that the active pumping of specific ions forms the core of the countercurrent multiplier system. Which of the following nephron segments is responsible for the active transport of Na+, Cl-, and K+ into the medullary interstitium to create this gradient?",
                options: {
                    A: "Cortical collecting duct",
                    B: "Proximal convoluted tubule",
                    C: "Thick ascending loop of Henle",
                    D: "Thin ascending loop of Henle",
                    E: "Thin descending loop of Henle"
                },
                correctAnswer: "C",
                rationale: "The countercurrent multiplier system relies on the active transport of Na+, Cl-, K+ and other ions specifically from the thick ascending loops of Henle into the medullary interstitium to build up the solute gradient.",
                source: "Renal Water & Renal Sodium PDF, slide 28: 'Factors That Contribute to Buildup of Solute in Renal Medulla - Countercurrent Multiplier • Active transport of Na+, Cl-, K+ and other ions from thick ascending loops of Henle into medullary interstitium'"
            },
            {
                section: "Renal Water & Renal Sodium",
                fullLO: "LO3: Explain the operation and importance of the counter current multiplier in the formation of concentrated urine.",
                question: "A physiologist evaluates the role of the countercurrent multiplier in a healthy subject. He determines that while the medullary osmotic gradient is critical for driving water out of the collecting ducts, the absolute largest volume of water reabsorption from the filtrate actually occurs elsewhere. According to the net effects of the countercurrent multiplier, most water reabsorption occurs in the:",
                options: {
                    A: "Ascending loop of Henle",
                    B: "Cortex (proximal and distal convoluted tubules)",
                    C: "Inner medullary collecting duct",
                    D: "Outer medullary collecting duct",
                    E: "Vasa recta"
                },
                correctAnswer: "B",
                rationale: "While the medullary countercurrent multiplier establishes the gradient needed to concentrate urine, most of the actual bulk water reabsorption occurs in the cortex (specifically in the proximal tubule and distal convoluted tubule) rather than in the medulla.",
                source: "Renal Water & Renal Sodium PDF, slide 30: 'Net Effects of Countercurrent Multiplier... 3. Most of the water reabsorption occurs in the cortex (i.e., in the proximal tubule and in the distal convoluted tubule) rather than in the medulla.'"
            },
            {
                section: "Renal Water & Renal Sodium",
                fullLO: "LO4: Explain the role of urea in the formation of the medullary interstitial solute gradient and how this contributes to urine concentrating ability.",
                question: "A 22-year-old male bodybuilder consumes a massive amount of dietary protein daily, leading to the production of large amounts of nitrogenous wastes. Compared to an individual consuming a severely protein-deficient diet, this patient's kidneys will demonstrate which of the following physiological differences?",
                options: {
                    A: "Decreased medullary interstitial urea concentrations",
                    B: "Decreased maximum urine osmolarity",
                    C: "Increased ability to concentrate urine",
                    D: "Increased obligatory water loss in the proximal tubule",
                    E: "Inability to reabsorb water in the collecting duct"
                },
                correctAnswer: "C",
                rationale: "People consuming high-protein diets produce large amounts of nitrogenous wastes (like urea). Because urea diffuses into the medullary interstitium and contributes significantly to the hyperosmotic gradient, individuals with high urea generation concentrate their urine better than malnourished people on protein-deficient diets.",
                source: "Renal Water & Renal Sodium PDF, slide 34: 'People consuming high protein diets produce large amounts of nitrogenous wastes and concentrate their urine better than people on protein deficient diets. Malnourished people exhibit low medullary interstitial urea concentrations and impaired renal concentrating ability.'"
            },
            {
                section: "Renal Water & Renal Sodium",
                fullLO: "LO4: Explain the role of urea in the formation of the medullary interstitial solute gradient and how this contributes to urine concentrating ability.",
                question: "A patient receives a continuous intravenous infusion of vasopressin (ADH). Inside the kidney, this hormone directly activates the UT-A1 transporter. This specific action enhances the diffusion of urea into the medullary interstitium from which of the following tubular segments?",
                options: {
                    A: "Cortical collecting tubule",
                    B: "Distal convoluted tubule",
                    C: "Medullary collecting tubule",
                    D: "Proximal convoluted tubule",
                    E: "Thick ascending limb"
                },
                correctAnswer: "C",
                rationale: "ADH increases urea permeability specifically in the medullary collecting tubule. Urea diffuses into the medullary interstitium from here, facilitated by the ADH-sensitive urea transporter UT-A1.",
                source: "Renal Water & Renal Sodium PDF, slide 34: 'ADH increases urea permeability of medullary collecting tubule. Urea diffuses into the medullary interstitium and this diffusion is facilitated by an ADH sensitive urea transporter, UT-A1, which is activated by ADH.'"
            },
            {
                section: "Renal Water & Renal Sodium",
                fullLO: "LO5: Explain the operation and importance of the counter current exchanger in the formation of concentrated urine.",
                question: "A researcher is studying renal hemodynamics and visualizes uniquely configured vascular beds that dip deeply into the renal medulla. These vessels serve as countercurrent exchangers to prevent the dissipation of medullary hyperosmolarity. Which of the following best describes the anatomical architecture that allows these vessels to limit solute \"washout\"?",
                options: {
                    A: "Branching directly off the interlobular arteries",
                    B: "High-pressure fenestrations",
                    C: "Parallel, countercurrent orientation of descending and ascending elements",
                    D: "Perpendicular orientation relative to the loop of Henle",
                    E: "Unidirectional flow directly into the renal pelvis"
                },
                correctAnswer: "C",
                rationale: "The vasa recta act as countercurrent exchangers. Their unique parallel, countercurrent U-shaped architecture (descending and ascending vascular elements running parallel) limits solute washout and maintains the hyperosmotic medullary gradient.",
                source: "Renal Water & Renal Sodium PDF, slides 36 & 39: 'The parallel, countercurrent orientation of the descending and ascending vascular elements minimize “washout” of solutes from the medullary interstitial fluid.' and 'U-shaped architecture limits solute washout'"
            },

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');
        const sectionNav = document.getElementById('section-nav');
        const customBuilder = document.getElementById('custom-builder');
        const rootElements = document.documentElement;

        let isRevealed = false;

        function toggleAllLOs() {
            isRevealed = !isRevealed;
            const btn = document.getElementById('reveal-all-btn');
            btn.textContent = isRevealed ? "Hide Learning Objectives" : "Show Learning Objectives";
            
            document.querySelectorAll('.lo-box').forEach(box => {
                box.style.display = isRevealed ? 'block' : 'none';
            });
        }

        function initQuiz() {
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    const sectionId = 'sec-' + sectionIndex;
                    
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    const navBtn = document.createElement('button');
                    let btnText = currentSection;
                    if (btnText.includes("Renal Water & Renal Sodium")) btnText = "Water & Sodium";
                    if (btnText.includes("EBM Disease Screening Session")) btnText = "EBM Screening";
                    if (btnText.includes("Renal Handling of K, Ca, and PO4")) btnText = "K, Ca, PO4 Handling";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
</body>
</html>
